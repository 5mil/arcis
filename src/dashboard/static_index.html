<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Arcis</title>
<style>body{font-family:sans-serif;background:#070b14;color:#e2e8f0;margin:2rem}a{color:#38bdf8}pre{background:#0b1220;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head>
<body>
<p>Arcis · <a href="http://192.168.50.143:8787/">MagiMDM desk</a></p>
<h1>Library / infer</h1>
<p>Health: <span id="h">…</span></p>
<p>Library: <span id="lib">…</span></p>
<pre id="out">no infer yet</pre>
<form id="f"><input id="q" size="50" placeholder="prompt"/><button>Infer</button></form>
<script>
fetch('/health').then(r=>r.json()).then(j=>{document.getElementById('h').textContent=JSON.stringify(j)}).catch(()=>{document.getElementById('h').textContent='down'});
fetch('/rag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'algebra'})})
  .then(r=>r.text()).then(t=>{document.getElementById('lib').textContent=t}).catch(()=>{document.getElementById('lib').textContent='rag down'});
document.getElementById('f').onsubmit=async e=>{
 e.preventDefault();
 const r=await fetch('/infer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('q').value,max_tokens:'64'})});
 document.getElementById('out').textContent=await r.text();
};
</script></body></html>
